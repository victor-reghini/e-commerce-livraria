# ==============================================================================
# docker/prometheus/prometheus.yml
# Coleta de métricas de negócio, JVM e sistema via Spring Boot Actuator
# ==============================================================================

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "ecommerce-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 30s
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: "ecommerce-backend"
          environment: "production"

  - job_name: "prometheus"
    scrape_interval: 60s
    static_configs:
      - targets: ["localhost:9090"]

