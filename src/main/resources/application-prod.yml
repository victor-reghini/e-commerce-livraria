spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:4}
      connection-timeout: 10000
      idle-timeout: 180000
      max-lifetime: 900000
  jpa:
    show-sql: false
  flyway:
    validate-on-migrate: true

logging:
  config: classpath:logback-spring.xml

