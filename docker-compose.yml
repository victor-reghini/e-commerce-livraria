services:
  # ============================================================================
  # 1. Banco de Dados PostgreSQL 16 com RLS
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce_db}
      POSTGRES_USER: ${DATABASE_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ecommerce_user} -d ${DATABASE_NAME:-ecommerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 2. Cache e Sessões com Redis 7
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 3. Armazenamento S3-Compatible Local (S3Mock)
  # ============================================================================
  s3:
    image: adobe/s3mock:latest
    container_name: ecommerce-s3
    restart: unless-stopped
    environment:
      initialBuckets: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media},${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
      retainFilesOnExit: "true"
    ports:
      - "${MINIO_API_PORT:-9000}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 4. Mensageria Assíncrona com RabbitMQ 3
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 5. Backend Java 21 Spring Boot
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ENVIRONMENT: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-ecommerce_user}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
      AWS_ENDPOINT_URL: http://s3:9090
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      AWS_REGION: us-east-1
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      AWS_S3_BUCKET_MEDIA: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media}
      AWS_S3_BUCKET_EBOOKS: ${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-signing-key-ecommerce-platform-2026-production-ready-key}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ============================================================================
  # 6. Observabilidade & Métricas: Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network

  # ============================================================================
  # 7. Monitoramento de Logs: Grafana Loki & Promtail
  # ============================================================================
  loki:
    image: grafana/loki:3.2.0
    container_name: ecommerce-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:3.2.0
    container_name: ecommerce-promtail
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

  # ============================================================================
  # 8. Painel Visual & Dashboards: Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_secret_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/livraria-overview.json
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  loki_data:
  grafana_data:

