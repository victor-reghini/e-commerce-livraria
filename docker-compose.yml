services:
  # ============================================================================
  # 1. Banco de Dados PostgreSQL 16 com RLS
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce_db}
      POSTGRES_USER: ${DATABASE_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ecommerce_user} -d ${DATABASE_NAME:-ecommerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 2. Cache e Sessões com Redis 7
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 3. Armazenamento S3-Compatible com MinIO
  # ============================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: ecommerce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: ecommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      AWS_S3_BUCKET_MEDIA: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media}
      AWS_S3_BUCKET_EBOOKS: ${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - app-network

  # ============================================================================
  # 4. Mensageria Assíncrona com RabbitMQ 3
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ============================================================================
  # 5. Backend Java 21 Spring Boot
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ENVIRONMENT: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-ecommerce_user}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      AWS_REGION: us-east-1
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      AWS_S3_BUCKET_MEDIA: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media}
      AWS_S3_BUCKET_EBOOKS: ${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-signing-key-ecommerce-platform-2026-production-ready-key}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:

