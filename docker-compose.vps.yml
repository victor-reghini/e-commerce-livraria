# ==============================================================================
# docker-compose.vps.yml
# Orquestração de Produção para VPS Linux (Princípio Twelve-Factor & Zero Lock-in)
# ==============================================================================

services:
  # ============================================================================
  # 1. Reverse Proxy & Roteamento Dinâmico SSL (Traefik v3)
  # ============================================================================
  traefik:
    image: traefik:v3.1
    container_name: ecommerce-traefik
    restart: always
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TRAEFIK_ACME_EMAIL=${TRAEFIK_ACME_EMAIL:-admin@livrariamatriz.com.br}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_acme:/etc/traefik
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - app-network

  # ============================================================================
  # 2. Banco de Dados PostgreSQL 16 com RLS (Host Persistente)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce_db}
      POSTGRES_USER: ${DATABASE_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
    command: >
      postgres
      -c shared_buffers=384MB
      -c effective_cache_size=1280MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c min_wal_size=512MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=60
    volumes:
      - /var/lib/ecommerce/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-ecommerce_user} -d ${DATABASE_NAME:-ecommerce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.3"
          memory: 512M
    networks:
      - app-network

  # ============================================================================
  # 3. Cache & Sessões (Redis 7)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    restart: always
    command: >
      redis-server
      --requirepass ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - /var/lib/ecommerce/redis:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      - app-network

  # ============================================================================
  # 4. Armazenamento S3-Compatible Local (MinIO)
  # ============================================================================
  minio:
    image: pgsty/minio:latest
    container_name: ecommerce-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      GOMAXPROCS: "1"
    volumes:
      - /var/lib/ecommerce/minio:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN_NAME:-seudominio.com.br}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
    networks:
      - app-network

  minio-init:
    image: pgsty/mc:latest
    container_name: ecommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      AWS_S3_BUCKET_MEDIA: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media}
      AWS_S3_BUCKET_EBOOKS: ${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - app-network

  # ============================================================================
  # 5. Mensageria Assíncrona (RabbitMQ 3)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
    volumes:
      - /var/lib/ecommerce/rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    networks:
      - app-network

  # ============================================================================
  # 6. Observabilidade: Prometheus & Grafana Loki
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ecommerce-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=4GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 192M
    networks:
      - app-network

  loki:
    image: grafana/loki:3.2.0
    container_name: ecommerce-loki
    restart: always
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 192M
    networks:
      - app-network

  promtail:
    image: grafana/promtail:3.2.0
    container_name: ecommerce-promtail
    restart: always
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecommerce-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_secret_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://${GRAFANA_SUBDOMAIN:-grafana.seudominio.com.br}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/livraria-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_SUBDOMAIN:-grafana.seudominio.com.br}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - app-network

  # ============================================================================
  # 7. Backend Java 21 Spring Boot (Loom / Virtual Threads)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ENVIRONMENT: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-ecommerce_db}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER:-ecommerce_user}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-ecommerce_secret_password}
      HIKARI_MAX_POOL_SIZE: 10
      HIKARI_MIN_IDLE: 4
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-redis_secret_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-rabbit_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret_password}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_admin_user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_admin_secret_password}
      AWS_REGION: us-east-1
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      AWS_S3_BUCKET_MEDIA: ${AWS_S3_BUCKET_MEDIA:-ecommerce-media}
      AWS_S3_BUCKET_EBOOKS: ${AWS_S3_BUCKET_EBOOKS:-ecommerce-ebooks}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=100
        -XX:+UseStringDeduplication
        -Xms768m
        -Xmx1344m
        -XX:MetaspaceSize=128m
        -XX:MaxMetaspaceSize=256m
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.threads.virtual.enabled=true
    deploy:
      resources:
        limits:
          cpus: "1.8"
          memory: 1792M
        reservations:
          cpus: "0.5"
          memory: 1024M
    ports:
      - "${SERVER_PORT:-8080}:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_SUBDOMAIN:-api.seudominio.com.br}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${DOMAIN_NAME:-seudominio.com.br}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=backend-compress@docker"
      - "traefik.http.middlewares.backend-compress.compress=true"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  traefik_acme:
  prometheus_data:
  loki_data:
  grafana_data:

