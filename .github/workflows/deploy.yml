name: CD - Deploy to VPS Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS via SSH & Docker Compose
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/ecommerce-backend"
            echo "Acessando diretório da aplicação: $APP_DIR"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Criando diretório e clonando repositório..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              echo "Atualizando código fonte..."
              git fetch --all
              git reset --hard origin/main
            fi
            
            echo "Verificando arquivo .env..."
            if [ ! -f ".env" ]; then
              echo "[AVISO] Arquivo .env não encontrado. Copiando de .env.example..."
              cp .env.example .env
            fi
            
            echo "Executando deploy com Docker Compose VPS..."
            docker compose -f docker-compose.vps.yml pull || true
            docker compose -f docker-compose.vps.yml build backend
            docker compose -f docker-compose.vps.yml up -d --remove-orphans
            
            echo "Deploy concluído com sucesso!"
            docker compose -f docker-compose.vps.yml ps

